services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pyrosphere-db
    environment:
      POSTGRES_DB: pyrosphere
      POSTGRES_USER: pyrosphere
      POSTGRES_PASSWORD: pyrosphere_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: